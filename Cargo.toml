[package]
name = "taurino-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
tokio = {version = "1",features = ["macros","rt-multi-thread","time","fs", "sync"]}
http = "1"
serde = { version = "1", features = ["derive"] }
wry = { version = "0.56.0", default-features = false, features = [
  "os-webview",
  "linux-body",
] }
image = { version = "0.25", default-features = false}
tao = { version = "0.37.0", default-features = false, features = ["rwh_06"] }
thiserror = "2.0.20"
log = "0.4.34"
serde_json = "1.0.151"
dpi = { version = "0.1.2", features = ["serde"] }
raw-window-handle = "0.6"
url = { version = "2" , features = ["serde"] }
serde_with = "3"
infer = "0.22.0"
tray-icon = { version = "0.25.1" , features = ["serde"] }
muda = "0.20.0"
global-hotkey = "0.8.0"
getrandom = "0.4.3"
dunce = "1.0.5"

[target."cfg(windows)".dependencies]
once_cell = "1.21.4"
softbuffer = "0.4.8"
webview2-com = "0.38"
windows = "0.62.2"
windows-sys = "0.61.2"


[features]
default = ["x11", "dbus"]
devtools = ["wry/devtools"]
x11 = ["tao/x11", "wry/x11"]
macos-private-api = []
# TODO: Remove in v3 - wry does not have this feature anymore
objc-exception = []
# tracing = ["dep:tracing", "wry/tracing"]
macos-proxy = ["wry/mac-proxy"]
unstable = []
common-controls-v6 = ["windows/Win32_UI_Controls", "windows/Win32_UI_Shell"]
dbus = ["tao/dbus"]
